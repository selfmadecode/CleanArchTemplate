<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optima Contact Us</title>
</head>
<body style="
      padding: 0;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      width: 100%;
      margin: 0 auto;
      background: #f8a7581a;
    ">
    <main style="max-width: 530px; width: 100%; margin: 50px auto 0;">
        <div style="padding: 80px 30px 20px; padding-top: 56px; background: white">
            <h2 style="
            font-style: normal;
            font-weight: bold;
            font-size: 24px;
            line-height: 32px;
            color: #faa84f;
            text-align: center;
          ">
                Optima Contact Us
            </h2>

            <section style="margin-top: 30px">
                <p style="
              font-style: normal;
              font-size: 16px;
              font-weight: 500;
              line-height: 24px;
              color: #000000;
              margin-bottom: 15px;
              text-align: center;
            ">
                    <span>Email: {0}</span>.
                </p>
                <p style="
              font-style: normal;
              font-size: 16px;
              font-weight: 500;
              line-height: 24px;
              color: #000000;
              width: 80%;
              margin: 0 auto;
              text-align: center;
            ">
                    <span> Full Name: {1} </span>
                </p>

                <p style="
              font-style: normal;
              font-size: 16px;
              font-weight: 500;
              line-height: 24px;
              color: #000000;
              width: 80%;
              margin: 0 auto;
              text-align: center;
            ">
                    <span> Subject: Contact us </span>
                </p>

                <p style="
              font-style: normal;
              font-size: 16px;
              font-weight: 500;
              line-height: 24px;
              color: #000000;
              width: 80%;
              margin: 0 auto;
              text-align: center;
            ">
                    <span> Question: {2}</span>
                </p>

            </section>
        </div>
    </main>
</body>
</html>
